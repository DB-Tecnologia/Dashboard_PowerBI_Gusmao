services:
  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    container_name: dashboard-power-bi-api-dev
    command: pnpm --filter @dashboard-power-bi/api dev
    env_file:
      - ../env/.env.example
    environment:
      NODE_ENV: development
      PORT: ${API_PORT:-3001}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
      DATABASE_PROVIDER: oracle
      ORACLE_HOST: oracle
      ORACLE_PORT: '1521'
      ORACLE_SERVICE_NAME: XEPDB1
      ORACLE_USER: system
      ORACLE_PASSWORD: oracle
      ORACLE_POOL_MIN: '0'
      ORACLE_POOL_MAX: '5'
    ports:
      - '${API_PORT:-3001}:3001'
    volumes:
      - ../..:/workspace
      - /workspace/node_modules
      - api_app_node_modules:/workspace/apps/api/node_modules
      - web_app_node_modules:/workspace/apps/web/node_modules
    working_dir: /workspace
    depends_on:
      redis:
        condition: service_healthy
      oracle:
        condition: service_healthy
    networks:
      - dashboard-power-bi-dev

  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
    container_name: dashboard-power-bi-web-dev
    command: pnpm --filter @dashboard-power-bi/web dev
    env_file:
      - ../env/.env.example
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    ports:
      - '${WEB_PORT:-3000}:3000'
    volumes:
      - ../..:/workspace
      - /workspace/node_modules
      - api_app_node_modules:/workspace/apps/api/node_modules
      - web_app_node_modules:/workspace/apps/web/node_modules
      - web_next_build:/workspace/apps/web/.next
    working_dir: /workspace
    depends_on:
      - api
    networks:
      - dashboard-power-bi-dev

  oracle:
    image: gvenzl/oracle-xe:21-full
    container_name: dashboard-power-bi-oracle-dev
    environment:
      ORACLE_PASSWORD: oracle
      APP_USER: extrator
      APP_USER_PASSWORD: oracle
    ports:
      - '${ORACLE_PORT:-1521}:1521'
    volumes:
      - oracle_data:/opt/oracle/oradata
      - ../../exp_full_xecdb_20260612-1215.dmp:/opt/oracle/dump/exp_full_xecdb_20260612-1215.dmp:ro
      - ./oracle/import-dump.sh:/opt/oracle/scripts/extensions/import-dump.sh:ro
    healthcheck:
      test: ['CMD', 'healthcheck.sh']
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    networks:
      - dashboard-power-bi-dev

  redis:
    image: redis:7.4-alpine
    container_name: dashboard-power-bi-redis-dev
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dashboard-power-bi-dev

networks:
  dashboard-power-bi-dev:
    driver: bridge

volumes:
  api_app_node_modules:
  web_app_node_modules:
  web_next_build:
  redis_data:
  oracle_data:
